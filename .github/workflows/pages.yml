name: pages

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/
      - uses: actions/deploy-pages@v5
